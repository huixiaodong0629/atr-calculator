<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>ATR止盈止损计算器</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #f5f5f5;
    color: #222;
  }
  .box {
    max-width: 480px;
    margin: 0 auto;
    padding: 28px 20px;
  }
  h1 {
    text-align: center;
    font-size: 24px;
    margin: 10px 0 28px;
  }
  label {
    display: block;
    font-size: 17px;
    margin: 18px 0 8px;
  }
  input {
    width: 100%;
    height: 52px;
    padding: 0 14px;
    font-size: 20px;
    border: 1px solid #ccc;
    border-radius: 10px;
    background: white;
    outline: none;
  }
  input:focus { border-color: #777; }
  .result {
    margin-top: 28px;
    background: white;
    border-radius: 14px;
    padding: 18px;
  }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 0;
    border-bottom: 1px solid #eee;
  }
  .row:last-child { border-bottom: 0; }
  .name { font-size: 18px; }
  .value {
    font-size: 22px;
    font-weight: 600;
  }
  .tip {
    margin-top: 20px;
    text-align: center;
    color: #888;
    font-size: 14px;
  }
  button {
    width: 100%;
    height: 48px;
    margin-top: 18px;
    border: 0;
    border-radius: 10px;
    font-size: 17px;
    background: #222;
    color: white;
  }
</style>
</head>
<body>
<div class="box">
  <h1>ATR止盈止损计算器</h1>

  <label for="atr">ATR</label>
  <input id="atr" type="number" inputmode="decimal" step="any" placeholder="请输入 ATR">

  <label for="price">成交价</label>
  <input id="price" type="number" inputmode="decimal" step="any" placeholder="请输入成交价">

  <button onclick="clearAll()">清空</button>

  <div class="result">
    <div class="row">
      <span class="name">止盈价</span>
      <span class="value" id="takeProfit">—</span>
    </div>
    <div class="row">
      <span class="name">止损价</span>
      <span class="value" id="stopLoss">—</span>
    </div>
  </div>

  <div class="tip">公式：止盈 = 成交价 + 0.5 × ATR<br>止损 = 成交价 − 0.75 × ATR</div>
</div>

<script>
const atr = document.getElementById('atr');
const price = document.getElementById('price');
const takeProfit = document.getElementById('takeProfit');
const stopLoss = document.getElementById('stopLoss');

function calculate() {
  const a = parseFloat(atr.value);
  const p = parseFloat(price.value);

  if (Number.isFinite(a) && Number.isFinite(p)) {
    takeProfit.textContent = (p + 0.5 * a).toFixed(4).replace(/\.?0+$/, '');
    stopLoss.textContent = (p - 0.75 * a).toFixed(4).replace(/\.?0+$/, '');
  } else {
    takeProfit.textContent = '—';
    stopLoss.textContent = '—';
  }
}

function clearAll() {
  atr.value = '';
  price.value = '';
  calculate();
  atr.focus();
}

atr.addEventListener('input', calculate);
price.addEventListener('input', calculate);
</script>
</body>
</html>
